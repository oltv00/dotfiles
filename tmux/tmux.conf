# --- Prefix: Ctrl-a (was Ctrl-b). Double-tap Ctrl-a to send a
#     real Ctrl-a to the shell, e.g. to jump to start of line.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Faster escape-time so key combos feel snappy
set -g escape-time 10

# Repeat time for repeatable commands (resizes)
set -g repeat-time 1000

# --- Index windows & panes from 1 (feels like tab numbering)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Shows the folder while in a shell, but the program name while using an app
setw -g automatic-rename on
setw -g automatic-rename-format \
  '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'

# --- Shell integration: run zsh, vi-style copy mode
set -g default-shell $SHELL
setw -g mode-keys vi

# --- True color + 256-color support with Ghostty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"
set -g focus-events on
set -g allow-passthrough on        # helps OSC 52 / apps reach the terminal

# --- Notifications
set -g bell-action none
set -g monitor-bell off
set -g monitor-activity off
set -g visual-activity off

# --- Mouse: click panes, scrollback, drag to resize
set -g mouse on
# A plain left click clears an existing selection.
bind-key -T copy-mode MouseDown1Pane { select-pane; send-keys -X clear-selection }
bind-key -T copy-mode-vi MouseDown1Pane { select-pane; send-keys -X clear-selection }
# Mouse drag select only, do not exit visual mode
bind-key -T copy-mode MouseDragEnd1Pane refresh-client
bind-key -T copy-mode-vi MouseDragEnd1Pane refresh-client
# Double click copy, do not exit visual mode
bind-key -T copy-mode DoubleClick1Pane { select-pane; send-keys -X select-word; run-shell -d 0.3; send-keys -X copy-selection }
bind-key -T copy-mode-vi DoubleClick1Pane { select-pane; send-keys -X select-word; run-shell -d 0.3; send-keys -X copy-selection }
bind-key -T root DoubleClick1Pane { select-pane -t=; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H; send-keys -X select-word; run-shell -d 0.3; send-keys -X copy-selection } }

# --- Scrollback history
set -g history-limit 10000

# --- Split panes with | and - (intuitive)
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# --- Move between panes with prefix + h/j/k/l (vim-style, but
#     requires prefix so it never steals vim's own h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# move current window to a session (creates it if name is new)
bind M command-prompt -p "move/split window into session:" "move-window -t '%%':"

# Move current window into a brand-new UUID-named session and switch to it.
bind N run-shell 'socket="#{socket_path}"; client="#{client_name}"; source="#{session_name}:#{window_index}"; name="win-$(uuidgen | tr "[:upper:]" "[:lower:]" | cut -c1-8)"; tmux -S "$socket" new-session -d -s "$name"; tmux -S "$socket" move-window -s "$source" -t "$name":; tmux -S "$socket" kill-window -t "$name":1;'

# Break current pane out to a new window, but DON'T switch to it
# (default Prefix+! already does this and moves you; this keeps you put)
bind B break-pane -d

# Join the previously-active window's active pane into THIS window
# vertical split (top/bottom):
bind V join-pane -s ! -v
# horizontal split (side by side):
bind S join-pane -s ! -h

# --- Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display 'tmux config reloaded'

# --- Copy mode (vi): v to start, y / Enter to copy to clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Enter send -X copy-selection

# clear screen, no prefix needed
bind -n C-k send-keys -R \; clear-history

# --- Clipboard: forward tmux copies to the macOS pasteboard via
#     Ghostty's OSC 52 support. No pbcopy/reattach hacks needed.
set -g set-clipboard on

# --- Status bar adapts to macOS light/dark mode (Catppuccin Mocha/Latte)
#     Detection: 'defaults read -g AppleInterfaceStyle' => "Dark" in dark mode,
#     empty in light. tmux reads this only when the config is sourced, so
#     after toggling the system theme, press prefix + r to repaint the bar.
if-shell "[ \"$(defaults read -g AppleInterfaceStyle 2>/dev/null)\" = 'Dark' ]" {
    # Catppuccin Mocha (dark)
    set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
    set -g status-left '#[fg=#a6e3a1,bold] #{?client_prefix,#S[ ],#S} '
    set -g status-right '#[fg=#7f849c] %H:%M %d-%b '
    setw -g window-status-current-style 'bold,fg=#89b4fa'
    setw -g window-status-style 'fg=#9399b2'
} {
    # Catppuccin Latte (light)
    set -g status-style 'bg=#eff1f5,fg=#4c4f69'
    set -g status-left '#[fg=#40a02b,bold] #{?client_prefix,#S[ ],#S} '
    set -g status-right '#[fg=#9ca0b0] %H:%M %d-%b '
    setw -g window-status-current-style 'bold,fg=#1e66f5'
    setw -g window-status-style 'fg=#9ca0b0'
}
set -g status-left-length 30
setw -g window-status-separator ' '

