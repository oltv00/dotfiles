## aria2 config — managed in ~/dotfiles/aria2/aria2.conf
## Install:  brew install aria2
## Symlink:  ln -s ~/dotfiles/aria2/aria2.conf ~/.aria2/aria2.conf
##           (aria2 looks for ~/.aria2/aria2.conf by default)
## Run:      aria2c --conf-path=~/.aria2/aria2.conf <url>
##           or just `aria2c <url>` once the symlink is in place.

## --- Directories ----------------------------------------------------------
## Where finished downloads land (change to your Mac Downloads path).
dir=/Users/oltv00/Downloads

## --- Speed / connections --------------------------------------------------
## Split each file into N segments and open up to N connections per server.
## This is the main reason aria2 beats curl/wget. 16 is a good default;
## lower to 8 if a host rate-limits or throttles you.
split=16
max-connection-per-server=16

## Hard cap so you don't saturate the whole link.
# max-download-limit=0
# max-upload-limit=0

## --- Resume / robustness --------------------------------------------------
## Resume partial downloads automatically.
continue=true

## Timeout / retry tuning for flaky connections.
connect-timeout=30
timeout=60
max-tries=5
retry-wait=3

## --- Concurrency ----------------------------------------------------------
## How many separate downloads run at once when fed a file with -i.
max-concurrent-downloads=5

## --- BitTorrent (optional) ------------------------------------------------
## Reasonable DHT/seeding defaults if you also grab torrents/magnets.
enable-dht=true
bt-enable-lpd=true
bt-seed-unverified=true
bt-save-metadata=true
seed-time=0

## --- Misc -----------------------------------------------------------------
## Report overall progress every 5s instead of per-file spam.
summary-interval=5

## Don't allocate the full file size upfront (sparser, faster on APFS).
file-allocation=none

## Console log level: notice / warn / error.
log-level=notice
